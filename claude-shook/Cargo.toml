[package]
name = "claude-shook"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The Claude Code front of shook: one hook per event, running a chain of entries and answering the host once"
repository = "https://github.com/orgrinrt/git-shook"
readme = "README.md"
publish = false

[[bin]]
name = "claude-shook"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
